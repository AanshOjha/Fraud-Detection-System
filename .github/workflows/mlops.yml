name: MLOps Pipeline

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  train-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare simulated batches
        run: python scripts/simulate_batches.py --force

      - name: Run smoke training pipeline
        run: python scripts/smoke_test.py

      - name: Build Docker image
        run: docker build -t fraud-api:ci .
